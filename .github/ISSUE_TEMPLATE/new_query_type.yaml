name: New Query Type
description: Propose a new query type on Tellor Layer (not a SpotPrice pair).
title: "New Query Type Request for [type name]"
body:
  - type: markdown
    attributes:
      value: |
        This form proposes a new query type for Tellor Layer. Filing it is intake; the type is not live until it is registered on Layer (`register-spec`). The team can help if needed.

        Just need a price pair (btc/usd, eth/eur, etc.)? `SpotPrice` already exists. Close this and use New Spot Price instead.
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: ex. email@example.com, @discord/github_handle
    validations:
      required: true
  - type: input
    id: target-network
    attributes:
      label: Where do you need this data?
      description: Layer is always where it is reported. List consumer chains (EVM or otherwise) if it will be read off Layer.
      placeholder: ex. Layer only, or ethereum, base, robinhood, etc.
    validations:
      required: true
  - type: input
    id: frequency
    attributes:
      label: How often should it update?
      description: How often reporters should submit. On Layer that is tipping cadence unless this queryId later joins the cyclelist (separate from this form).
      placeholder: ex. every 20 min, or on 0.5% deviation, or once per event
  - type: input
    id: type-name
    attributes:
      label: Query Type Name
      description: Choose a new, unregistered PascalCase name. Existing specification names include SpotPrice and EVMCall; TRBBridge is a legacy specification name. Layer compares names case-insensitively.
      placeholder: Enter a new, unregistered PascalCase name
    validations:
      required: true
  - type: textarea
    id: query-type-description
    attributes:
      label: Description
      description: Purpose of the type and suggested use cases.
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Query Parameters

        Parameters vary per instance of the type. Names should be `mixedCase`. Types are Ethereum ABI types; Layer uses the same encoding so values can be bridged to EVM without a second spec.

        Each parameter needs:
        - Name
        - Description / allowed values
        - ABI type (`string`, `uint256`, `bool`, `bytes`, etc.)
        - Order (encode order for query data below)

        Example (`SpotPrice`):

        ```
        1. asset
            - description: Asset ID (e.g. btc)
            - value type: string
        2. currency
            - description: Selected currency (e.g. usd)
            - value type: string
        ```

        For a type with no semantic parameters, include a single empty bytes argument named `phantom`:

        ```
        1. phantom
            - description: Empty bytes, always used for query types with no arguments
            - value type: bytes
        ```
  - type: textarea
    id: your-query-parameters
    attributes:
      label: Your query parameters
      description: Name, description, ABI type, in encode order. Use the format from the example above.
      placeholder: |-
        1. parameter-name1
            - description: ...
            - value type: string
        2. parameter-name2
            - description: ...
            - value type: string
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Query Data / Query ID

        Use nested ABI encoding with the parameters in the order above. Use the canonical PascalCase Query Type Name exactly; capitalization affects queryData and queryId.

        Example (`SpotPrice`, btc/usd):

        ```
        queryData = abi.encode("SpotPrice", abi.encode("btc", "usd"))
        queryId   = keccak256(queryData)
        ```

        Give concrete parameter values below. Ask the team or use [queryidstation](https://tellor.io/queryidstation/) to generate and verify queryData and queryId from your type name, ABI types, and values. You do not need to calculate hex. For more complex patterns, see existing specs such as `EVMCall` in dataSpecs.
  - type: textarea
    id: concrete-query-example
    attributes:
      label: Concrete query example
      description: Give one exact value for each parameter in the ABI order above. Quote strings and give complete array or tuple values where needed. For no-arg types, use phantom = 0x (empty bytes).
      placeholder: |-
        1. asset (string): "btc"
        2. currency (string): "usd"
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Response Type

        This is the type of the reported value, registered on Layer as `response_value_type`. Reporters ABI-encode it the same way so it decodes on Layer and on EVM (`abi.encode`, not `abi.encodePacked`).

        Layer accepts types such as `uint256`, `int256`, `string`, `bool`, `address`, `bytes`, and arrays of those (`uint256[]`, `string[]`, etc.). Choose an aggregation method that matches the response type; see Aggregation below.

        Do not use `ufixed256x18` or `bytes32`; those are not valid Layer registry types. Prices with 18 decimals use `uint256`; the decimals are a spec convention.

        Example (`SpotPrice` on Layer):

        ```
        - response_value_type: uint256
        - precision: 18 decimals (e.g. $99.90 → 99900000000000000000)
        - encoding: abi.encode(uint256 value)
        ```
  - type: textarea
    id: your-response-type
    attributes:
      label: Your response type
      description: Layer response_value_type, plus precision/encoding notes.
      placeholder: |-
        - response_value_type: uint256
        - precision: 18 decimals
        - encoding: abi.encode(uint256 value)
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Aggregation

        On Layer, submissions in a queryId's reporting window are stake-weighted into one official value (even if you only consume on EVM).

        Spec fields:
        - `aggregation_method`: `weighted-median` (unsigned scalar integers only, e.g. `uint256` prices) or `weighted-mode` (exact categorical/discrete values)
        - `report_block_window`: Layer blocks in the window (`SpotPrice` uses `2`)

        If unsure which method fits your response type, choose "Not sure" below. Consumer checks (e.g. 2/3 power, optimistic delay) are your contract's policy, not part of the query type.
  - type: dropdown
    id: aggregation-method
    attributes:
      label: Aggregation method
      description: How Layer should combine reporters' submissions for this type.
      options:
        - weighted-median (unsigned scalar integers only, e.g. uint256 prices)
        - weighted-mode (exact categorical or discrete values)
        - Not sure / need maintainer guidance
    validations:
      required: true
  - type: input
    id: report-block-window
    attributes:
      label: Report block window
      description: Layer blocks in the reporting window before aggregation. Must be a whole number and cannot exceed the current registry max_report_buffer_window. SpotPrice uses 2; slow or manual data may need more time.
      placeholder: ex. 2
    validations:
      required: true
  - type: markdown
    attributes:
      value: |
        ## Dispute considerations

        Layer disputes a reporter, not a floating value. This section guides reporters and voters; it does not stop a dispute or guarantee a report. Be specific enough that an honest reporter knows what "correct" means.
  - type: textarea
    id: dispute-considerations
    attributes:
      label: How should this data be judged?
      description: How to fetch it, how to encode it, and when a submission is wrong. What if an API is down or sources disagree?
      placeholder: "SpotPrice example: Compare multiple price sources where possible. Do not report if a reasonable market price cannot be determined. A reported value must be reasonable enough for community consensus."
    validations:
      required: true
  - type: textarea
    id: suggested-data-sources
    attributes:
      label: Suggested data sources
      description: Where reporters can retrieve the response programmatically. Prefer multiple sources.
      placeholder: ex. APIs, contracts, or official pages. Note anything that can break (illiquid market, one oracle, timezone).
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Additional instances, expected volume, or why this type is needed.
      placeholder: Optional
  - type: textarea
    id: feedback
    attributes:
      label: Form Feedback
      description: Was anything on this form confusing or hard to understand?
